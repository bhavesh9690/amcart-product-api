name: Product Service - Build and Push to ECR

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: product-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Generate image tag
      # Example: v20260819085618-72fb71c
      - name: Generate Docker Image Tag
        run: |
          IMAGE_TAG="v$(date -u +'%Y%m%d%H%M%S')-${GITHUB_SHA::6}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Generated image tag: $IMAGE_TAG"

      # 3. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Verify ECR repository
      - name: Verify ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-name $ECR_REPOSITORY \
            --region $AWS_REGION

      # 6. Build Docker image
      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      # 7. Push Docker image to ECR
      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 8. Display image URI
      - name: Display Image URI
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "=========================================="
          echo "Docker image pushed successfully"
          echo "=========================================="
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # 9. Update Kubernetes Deployment with new image
      - name: Deploy New Image to EKS 
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Deploying image:" echo "$IMAGE_URI"
          
      # 10. Deploy Image    
      - name: Update kubeconfig (staging)
        run: |
          aws eks update-kubeconfig --name amcart-test-latest --region eu-north-1
      - name: Deploy tagged image to staging EKS
        run: |
          kubectl set image deployment/product-service \
            product-service=$IMAGE_URI \
            -n ecommerce
          kubectl rollout status deployment/product-service -n ecommerce
